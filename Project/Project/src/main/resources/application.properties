spring.application.name=Project
server.servlet.session.timeout=30m

# Database connection properties
spring.datasource.url=jdbc:mysql://localhost:3306/service_scout_db
spring.datasource.username=your_username
spring.datasource.password=your_password

# JDBC driver for MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate properties
spring.jpa.hibernate.ddl-auto=update  # Creates or updates tables automatically based on entities
spring.jpa.show-sql=true             # Show SQL statements in the console
spring.jpa.properties.hibernate.format_sql=true
